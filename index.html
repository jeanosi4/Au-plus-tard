<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Au plus tard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">

<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14213d;--mute:#5b677d;--line:#d5dce6;--late:#c1121f;--soon:#b36b00;--ok:#1f7a6f;--btn:#14213d;--btnt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1624;--card:#18223a;--ink:#e8edf7;--mute:#9aa7c0;--line:#2b3856;--late:#ff6b6b;--soon:#f2b441;--ok:#4cc9b0;--btn:#e8edf7;--btnt:#0f1624}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1624;--card:#18223a;--ink:#e8edf7;--mute:#9aa7c0;--line:#2b3856;--late:#ff6b6b;--soon:#f2b441;--ok:#4cc9b0;--btn:#e8edf7;--btnt:#0f1624}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:620px;margin:0 auto;padding:24px 16px 48px}
.top{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px}
.top select{width:auto;padding:6px 8px;font-size:.9rem}
.lo{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:.9rem}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.stats{display:flex;gap:10px;margin-bottom:20px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:1.6rem;font-weight:800}
.stat span{color:var(--mute);font-size:.85rem}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
form .full{grid-column:1/-1}
label{display:flex;flex-direction:column;font-size:.82rem;color:var(--mute);gap:4px}
input,select{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
button{font:inherit;cursor:pointer}
.add{background:var(--btn);color:var(--btnt);border:0;border-radius:10px;padding:12px;font-weight:600}
.add.alt{background:none;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--soon);outline-offset:2px}
.item{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--ok);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.item.soon{border-inline-start-color:var(--soon)}.item.late{border-inline-start-color:var(--late)}
.count{min-width:64px;text-align:center;font-weight:800;font-size:1.5rem;line-height:1.1;color:var(--ok)}
.soon .count{color:var(--soon)}.late .count{color:var(--late)}
.count small{display:block;font-size:.72rem;font-weight:400;color:var(--mute)}
.info{flex:1;min-width:0}
.info strong{display:block;overflow-wrap:anywhere}
.info span{color:var(--mute);font-size:.85rem}
.acts{display:flex;flex-direction:column;gap:6px}
.acts a{text-align:center;text-decoration:none}
.acts a,.acts button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px 9px;font-size:.8rem;display:block}
.quota{color:var(--mute);font-size:.85rem;margin:-8px 0 14px}
.up{display:none;background:var(--card);border:2px solid var(--soon);border-radius:14px;padding:14px;margin-bottom:16px}.up.on{display:block}.up p{margin:0 0 10px}
.up a.pay{display:block;text-align:center;background:var(--btn);color:var(--btnt);border-radius:10px;padding:12px;font-weight:600;text-decoration:none;margin-bottom:10px}
.up .row{display:flex;gap:8px}.up .add{width:auto;padding:10px 16px}
.empty{text-align:center;color:var(--mute);padding:28px 10px;border:2px dashed var(--line);border-radius:14px}
.tip{color:var(--mute);font-size:.82rem;margin-top:12px}
</style>
</head>
<body>
<main>
<div class="top">
<select id="lg" aria-label="Langue / Language"><option value="fr">Français</option><option value="en">English</option><option value="es">Español</option><option value="pt">Português</option><option value="ar">العربية</option></select>

<button id="out" class="lo" type="button" hidden data-t="logout"></button>
</div>
<h1>Au plus tard</h1>
<p class="sub" data-t="sub"></p>
<section id="auth">
<form id="af">
<label class="full"><span data-t="email"></span><input id="em" type="email" required autocomplete="email"></label>
<label class="full"><span data-t="pw"></span><input id="pw" type="password" required minlength="6" autocomplete="current-password"></label>
<button class="add full" type="submit" data-t="login"></button>
<button class="add alt full" id="su" type="button" data-t="signup"></button>
<p class="tip full" id="am"></p>
</form>
</section>
<section id="app" hidden>
<div class="stats">
<div class="stat"><b id="s1">0</b><span data-t="s1"></span></div>
<div class="stat"><b id="s2">0</b><span data-t="s2"></span></div>
</div>
<p class="quota" id="q"></p>
<div class="up" id="up"><p><strong data-t="upT"></strong></p><p id="upd"></p><a class="pay" id="pay" target="_blank" rel="noopener"></a><a class="pay" id="payy" target="_blank" rel="noopener"></a><div class="row"><input id="cd" data-ph="upC" autocomplete="off"><button class="add" id="act" type="button" data-t="upA"></button></div><p class="tip" id="cm"></p></div>
<form id="f">
<label class="full"><span data-t="what"></span><input id="n" required maxlength="60" data-ph="ph"></label>
<label><span data-t="due"></span><input id="d" type="date" required></label>
<label><span data-t="type"></span><select id="c"></select></label>
<label><span data-t="cost"></span><input id="m" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0"></label>
<label><span data-t="rep"></span><select id="r"></select></label>
<button class="add full" type="submit" data-t="add"></button>
<p class="tip full" id="fm"></p>
</form>
<div id="list"></div>
<p class="tip" id="sy"></p>
</section>
</main>

document.getElementById("f").addEventListener("submit",async function(e){e.preventDefault();msg("fm","");
if(!pro()&&items.length>=CFG.FREE){showUp();return}
var res=await sb.from("deadlines").insert({name:document.getElementById("n").value.trim(),due_date:document.getElementById("d").value,category:document.getElementById("c").value,monthly_cost:parseFloat(document.getElementById("m").value)||0,repeat_months:parseInt(document.getElementById("r").value)});
if(res.error){if(/Limite/i.test(res.error.message))showUp();else msg("fm",tr("fail"));return}
this.reset();await loadAll()});
document.getElementById("list").addEventListener("click",async function(e){var b=e.target.closest("button");if(!b)return;var it=items[+b.dataset.i];if(!it)return;
if(b.dataset.a==="renew")await sb.from("deadlines").update({due_date:addM(it.due_date,it.repeat_months)}).eq("id",it.id);
else await sb.from("deadlines").delete().eq("id",it.id);
await loadAll()});
document.getElementById("act").addEventListener("click",async function(){msg("cm","");var code=document.getElementById("cd").value;if(!code.trim()||!sb)return;
var res=await sb.rpc("redeem_code",{p_code:code});
if(res.error){msg("cm",tr("fail"));return}
var o=res.data;
if(o&&o.ok){document.getElementById("cd").value="";await loadAll()}
else if(o&&o.error==="too_many_attempts")msg("cm",tr("tooMany"));
else msg("cm",tr("bad"))});
apply();
</script>
</body>
</html>
